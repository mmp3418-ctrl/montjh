<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Garden City L.L.C" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Garden City L.L.C</title>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('garden-city-theme')
          var lang = localStorage.getItem('garden-city-language')
          if (theme === 'light' || theme === 'dark') {
            document.documentElement.dataset.theme = theme
          }
          if (lang === 'en') {
            document.documentElement.lang = 'en'
            document.documentElement.dir = 'ltr'
          } else {
            document.documentElement.lang = 'ar'
            document.documentElement.dir = 'rtl'
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
